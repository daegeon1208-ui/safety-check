<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>현장 AR 마킹</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#D3162F">
<link rel="icon" href="../icon-192.png">
<style>
:root{
  --bg:#F2F2EE;--surface:#FFFFFF;--sunk:#E9EAE4;--ink:#1D1E1A;--muted:#66685F;--line:#D5D6CE;
  --brand:#D3162F;--focus:#1D4ED8;--r:10px;
  --t-danger:#D3162F;--t-defect:#E8730C;--t-check:#1D4ED8;--t-memo:#1E7A4B;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141513;--surface:#1E1F1C;--sunk:#262823;--ink:#ECECE6;--muted:#A3A59A;--line:#3A3C36}}
:root[data-theme="dark"]{--bg:#141513;--surface:#1E1F1C;--sunk:#262823;--ink:#ECECE6;--muted:#A3A59A;--line:#3A3C36}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}
header .ver{font-size:11px;opacity:.8}
main{max-width:720px;margin:0 auto;padding:14px 16px 120px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3 .full{grid-column:1/-1}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.start{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border-radius:var(--r);font-weight:700;padding:8px 12px;text-align:center}
.btn.primary{background:var(--brand);color:#fff}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.line{border:1px solid var(--line);background:var(--surface)}
.btn:disabled{opacity:.4}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.rec{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0}
.rec img{width:76px;height:76px;object-fit:cover;border-radius:8px;background:var(--sunk);flex:none}
.rec .t{font-weight:700}
.rec .s{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.chip{font-size:11px;color:#fff;border-radius:99px;padding:1px 7px}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.filter{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}
.filter button{flex:none;border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;background:var(--surface)}
.filter button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* 편집 화면 */
#editor{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column}
#edTop{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:#111;color:#fff}
#edTop .ttl{flex:1;font-size:13px;line-height:1.3}
#edTop button{color:#fff;padding:6px 10px;border:1px solid #444;border-radius:8px;font-size:14px}
#stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#stage canvas{max-width:100%;max-height:100%;touch-action:none}
#edBar{background:#111;color:#fff;padding:8px 12px calc(env(safe-area-inset-bottom) + 10px)}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.types button{border-radius:8px;padding:8px 0;font-weight:700;color:#fff;opacity:.45;border:2px solid transparent}
.types button.on{opacity:1;border-color:#fff}
.hint{font-size:12px;color:#bbb;text-align:center;margin:6px 0}
.edActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#markList{max-height:22vh;overflow:auto;margin:6px 0}
.mk{display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px solid #333}
.mk .n{width:26px;height:26px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.mk .m{flex:1;font-size:13px}
.mk .m small{color:#aaa}

/* 표시 수정 창 */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--surface);color:var(--ink);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
.sheet h3{margin:0 0 10px;font-size:16px}
.sheet .types button{opacity:.4}
.sheet .types button.on{opacity:1;border-color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:9px 0;font-weight:700;color:var(--muted)}
.seg button.on[data-v="0"]{background:var(--brand);color:#fff}
.seg button.on[data-v="1"]{background:#1E7A4B;color:#fff}
.done-tag{font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.done-tag.y{background:#1E7A4B;color:#fff}.done-tag.n{background:var(--brand);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

/* 상세 보기 */
#detail{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto}
#detail img{width:100%;display:block;border-radius:var(--r);border:1px solid var(--line)}

/* AR 화면 */
#arOverlay{position:fixed;inset:0;z-index:50;pointer-events:none;font-family:var(--f)}
#arOverlay > *{pointer-events:auto}
#arTop{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;background:linear-gradient(rgba(0,0,0,.6),transparent);color:#fff;display:flex;gap:8px;align-items:center}
#arTop .msg{flex:1;font-size:13px;text-shadow:0 1px 2px #000}
#arTop button{color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:8px;padding:6px 10px;background:rgba(0,0,0,.3)}
#arBottom{position:absolute;bottom:0;left:0;right:0;padding:10px 12px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(transparent,rgba(0,0,0,.7))}
#arBottom .types{margin-bottom:10px}
.arBtns{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;align-items:center}
.arBtns button{min-height:52px;border-radius:12px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.5)}
.arBtns .place{background:var(--brand);border-color:var(--brand);font-size:17px}
#cam{position:fixed;inset:0;z-index:50;background:#000;overflow:hidden;touch-action:none}
#camVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camPins{position:absolute;inset:0}
.cpin{position:absolute;width:0;height:0;pointer-events:none}
.cpin i{position:absolute;left:-17px;top:-52px;width:34px;height:34px;border-radius:50%;border:3px solid #fff;color:#fff;font:700 16px/28px var(--f);text-align:center;font-style:normal;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.cpin b{position:absolute;left:-8px;top:-22px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:22px solid}
#camTop{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;background:linear-gradient(rgba(0,0,0,.6),transparent);color:#fff;display:flex;gap:8px;align-items:center}
#camTop .msg{flex:1;font-size:13px;text-shadow:0 1px 2px #000}
#camTop button{color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:8px;padding:6px 10px;background:rgba(0,0,0,.3)}
#camBottom{position:absolute;bottom:0;left:0;right:0;padding:10px 12px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(transparent,rgba(0,0,0,.7))}
#camBottom .types{margin-bottom:10px}
#camBottom .arBtns button{font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:rgba(20,20,20,.92);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:90;max-width:90vw;text-align:center}
</style>
</head>
<body>
<header><h1>현장 AR 마킹</h1><span class="ver" id="ver"></span></header>

<main id="home">
  <section class="card">
    <h2>새 기록</h2>
    <div class="grid3">
      <div><label class="f" for="fDong">동</label>
        <select id="fDong"><option>101동</option><option>102동</option><option>103동</option><option>주차장</option><option>부속동</option><option>기타</option></select></div>
      <div><label class="f" for="fFloor">층</label>
        <input id="fFloor" list="floors" placeholder="예: B1F" autocomplete="off">
        <datalist id="floors"><option>B4F</option><option>B3F</option><option>B2F</option><option>B1F</option><option>1F</option><option>2F</option><option>3F</option><option>RF</option></datalist></div>
      <div class="full"><label class="f" for="fCompany">업체</label>
        <select id="fCompany"><option>동우건설 (골조)</option><option>세모건설 (토목)</option><option>수우전기 (전기)</option><option>정진설비 (설비)</option><option>청오건설 (방수)</option><option>HK안전시스템 (안전시설물)</option><option>기타·미정</option></select></div>
      <div class="full"><label class="f" for="fPlace">위치·내용</label>
        <input id="fPlace" placeholder="예: X3~X5 / Y2 슬래브 하부" autocomplete="off"></div>
    </div>
    <div class="start">
      <button class="btn primary" id="btnCam">카메라로 마킹</button>
      <button class="btn dark" id="btnPhoto">사진으로 마킹</button>
      <button class="btn line hidden" id="btnAR" style="grid-column:1/-1">AR로 마킹 (바닥·벽 인식, 안드로이드)</button>
    </div>
    <input type="file" id="filePhoto" accept="image/*" capture="environment" class="hidden">
    <p class="note" id="arSupport">카메라로 마킹: 카메라 화면을 누르면 그 자리에 하자 번호가 붙고, 휴대폰을 돌려도 그 방향에 붙어 있습니다. 다 찍으면 촬영해서 저장합니다.</p>
  </section>

  <section class="card">
    <h2>기록 목록</h2>
    <div class="filter" id="filter"></div>
    <div id="list"></div>
  </section>
</main>

<!-- 사진 위 마킹 / AR 촬영 후 정리 -->
<div id="editor" class="hidden">
  <div id="edTop"><div class="ttl" id="edTitle"></div><button id="edCancel">취소</button></div>
  <div id="stage"><canvas id="edCanvas"></canvas></div>
  <div id="edBar">
    <div class="types" id="edTypes"></div>
    <p class="hint">사진을 누르면 그 자리에 번호 표시가 생깁니다. 표시를 누르면 메모를 쓰거나 지울 수 있습니다.</p>
    <div id="markList"></div>
    <div class="edActions"><button class="btn line" id="edUndo" style="color:#fff;background:#222;border-color:#444">마지막 표시 지우기</button><button class="btn primary" id="edSave">저장</button></div>
  </div>
</div>

<!-- 표시 메모 창 -->
<div id="markSheet" class="sheet hidden">
  <div class="box">
    <h3 id="msTitle">표시</h3>
    <div class="types" id="msTypes"></div>
    <label class="f" for="msMemo" style="margin-top:10px">메모</label>
    <textarea id="msMemo" rows="2" placeholder="예: 슬래브 하부 균열 0.3mm, 길이 약 1m"></textarea>
    <label class="f" style="margin-top:10px">조치 상태</label>
    <div class="seg" id="msDone"><button data-v="0">미조치</button><button data-v="1">조치완료</button></div>
    <div class="row2"><button class="btn line" id="msDel">표시 삭제</button><button class="btn primary" id="msOk">확인</button></div>
  </div>
</div>

<!-- 기록 상세 -->
<div id="detail" class="hidden">
  <header><button id="dBack" style="color:#fff;font-size:15px">‹ 목록</button><h1 id="dTitle" style="text-align:center"></h1><span style="width:44px"></span></header>
  <main>
    <img id="dImg" alt="마킹 사진">
    <div class="card" style="margin-top:12px" id="dInfo"></div>
    <div class="grid3">
      <button class="btn primary" id="dShare">공유 (카톡 등)</button>
      <button class="btn line" id="dSave">사진 저장</button>
      <button class="btn line" id="dEdit">표시 수정</button>
      <button class="btn line" id="dDel" style="color:var(--brand)">기록 삭제</button>
    </div>
  </main>
</div>

<!-- AR 화면 위 버튼 (dom-overlay) -->
<div id="arOverlay" class="hidden">
  <div id="arTop"><div class="msg" id="arMsg">휴대폰을 천천히 움직여 바닥·벽을 비춰 주세요.</div><button id="arExit">끝내기</button></div>
  <div id="arBottom">
    <div class="types" id="arTypes"></div>
    <div class="arBtns">
      <button id="arUndo">되돌리기</button>
      <button class="place" id="arPlace">여기 표시</button>
      <button id="arShot">촬영·저장</button>
    </div>
  </div>
</div>

<!-- 카메라로 마킹 (아이폰·안드로이드 공통) -->
<div id="cam" class="hidden">
  <video id="camVideo" playsinline muted autoplay></video>
  <div id="camPins"></div>
  <div id="camTop"><div class="msg" id="camMsg">하자 위치를 화면에서 누르세요.</div><button id="camExit">닫기</button></div>
  <div id="camBottom">
    <div class="types" id="camTypes"></div>
    <div class="arBtns">
      <button id="camUndo">되돌리기</button>
      <button class="place" id="camShot">촬영·저장</button>
      <button id="camGyro">방향고정 켬</button>
    </div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script type="module">
import * as THREE from "./lib/three.module.min.js";

const VERSION = "v2";
document.getElementById("ver").textContent = VERSION;
const $ = id => document.getElementById(id);

/* ---------- 표시 종류 ---------- */
const TYPES = [
  {k:"crack",  name:"균열",     color:"#D3162F"},
  {k:"leak",   name:"누수",     color:"#1D4ED8"},
  {k:"rebar",  name:"철근·피복", color:"#E8730C"},
  {k:"honey",  name:"곰보",     color:"#8B5CF6"},
  {k:"dim",    name:"치수·변형", color:"#0E7490"},
  {k:"finish", name:"마감",     color:"#A16207"},
  {k:"etc",    name:"기타",     color:"#4B5563"},
];
const typeOf = k => TYPES.find(t => t.k === k) || TYPES[0];
let curType = "crack";

function buildTypeButtons(box, getter, setter){
  box.innerHTML = "";
  for(const t of TYPES){
    const b = document.createElement("button");
    b.textContent = t.name; b.style.background = t.color; b.dataset.k = t.k;
    b.onclick = e => { e.stopPropagation(); setter(t.k); refresh(); };
    box.appendChild(b);
  }
  function refresh(){ for(const b of box.children) b.classList.toggle("on", b.dataset.k === getter()); }
  refresh();
  return refresh;
}

/* ---------- 알림 ---------- */
let toastT;
function toast(msg, ms=2200){ const t=$("toast"); t.textContent=msg; t.classList.remove("hidden"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.add("hidden"), ms); }

/* ---------- 저장소 (IndexedDB) ---------- */
const DB = new Promise((res, rej) => {
  const r = indexedDB.open("ar-mark", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("records", {keyPath:"id"});
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
async function tx(mode, fn){
  const db = await DB;
  return new Promise((res, rej) => {
    const t = db.transaction("records", mode); const s = t.objectStore("records");
    const out = fn(s); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error);
  });
}
const putRec = r => tx("readwrite", s => s.put(r));
const delRec = id => tx("readwrite", s => s.delete(id));
const allRecs = () => tx("readonly", s => s.getAll());
const getRec = id => tx("readonly", s => s.get(id));

/* ---------- 날짜 ---------- */
const pad = n => String(n).padStart(2,"0");
const fmtDate = ts => { const d=new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fileStamp = ts => { const d=new Date(ts); return `${String(d.getFullYear()).slice(2)}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`; };

/* ---------- 입력값 기억 ---------- */
function loadForm(){ try{ const v=JSON.parse(localStorage.getItem("ar-form")||"{}"); if(v.dong) $("fDong").value=v.dong; if(v.floor) $("fFloor").value=v.floor; if(v.company) $("fCompany").value=v.company; }catch{} }
function saveForm(){ try{ localStorage.setItem("ar-form", JSON.stringify({dong:$("fDong").value, floor:$("fFloor").value, company:$("fCompany").value})); }catch{} }
function formMeta(){ saveForm(); return {dong:$("fDong").value, floor:$("fFloor").value.trim(), place:$("fPlace").value.trim(), company:$("fCompany").value}; }

/* ---------- 위치(GPS) : 되면 넣고 안 되면 생략 ---------- */
function getGPS(){
  return new Promise(res => {
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res({lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), acc:Math.round(p.coords.accuracy)}), () => res(null), {timeout:6000, maximumAge:60000});
  });
}

/* ---------- 사진에 표시 그리기 ---------- */
function drawPin(ctx, x, y, n, color, R, done=false){
  ctx.save();
  ctx.beginPath(); ctx.moveTo(x, y);
  ctx.lineTo(x - R*0.55, y - R*1.3); ctx.lineTo(x + R*0.55, y - R*1.3); ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  ctx.beginPath(); ctx.arc(x, y - R*1.9, R, 0, Math.PI*2);
  ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = Math.max(2, R*0.16); ctx.strokeStyle = "#fff"; ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = `700 ${Math.round(R*1.15)}px ${getComputedStyle(document.body).fontFamily}`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(String(n), x, y - R*1.9 + R*0.05);
  if(done){
    const cx = x + R*0.8, cy = y - R*2.7, r = R*0.55;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fillStyle = "#1E7A4B"; ctx.fill();
    ctx.lineWidth = Math.max(2, R*0.12); ctx.strokeStyle = "#fff"; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - r*0.45, cy); ctx.lineTo(cx - r*0.1, cy + r*0.35); ctx.lineTo(cx + r*0.45, cy - r*0.35);
    ctx.lineWidth = Math.max(2, R*0.16); ctx.stroke();
  }
  ctx.restore();
}
const pinR = img => Math.max(14, Math.round(Math.min(img.width, img.height) * 0.035));

/* 사진 + 표시 + 아래 설명 띠를 한 장으로 */
async function composite(rec){
  const img = await blobToImage(rec.photo);
  const W = img.width, R = pinR(img);
  const fs = Math.max(16, Math.round(W * 0.026));
  const lineH = Math.round(fs * 1.5);
  const lines = rec.marks.map((m,i) => `${i+1}. [${typeOf(m.type).name}] ${m.memo || ""}  (${m.done ? "조치완료" : "미조치"})`);
  const head = `${fmtDate(rec.created)}  ${rec.dong} ${rec.floor}  ${rec.place}`.trim() + (rec.company ? `  / ${rec.company}` : "");
  const ctx0 = document.createElement("canvas").getContext("2d");
  ctx0.font = `400 ${fs}px sans-serif`;
  const wrapped = [];
  for(const l of [head, ...lines]) wrapped.push(...wrap(ctx0, l, W - fs*2));
  const footH = lineH * wrapped.length + fs * 1.4;
  const c = document.createElement("canvas"); c.width = W; c.height = img.height + footH;
  const ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0);
  rec.marks.forEach((m,i) => drawPin(ctx, m.x*W, m.y*img.height, i+1, typeOf(m.type).color, R, m.done));
  ctx.fillStyle = "#fff"; ctx.fillRect(0, img.height, W, footH);
  ctx.textBaseline = "top"; ctx.fillStyle = "#1D1E1A";
  let y = img.height + fs*0.7;
  const fam = getComputedStyle(document.body).fontFamily;
  wrapped.forEach((l, i) => { ctx.font = `${i===0?700:400} ${fs}px ${fam}`; ctx.fillText(l, fs, y); y += lineH; });
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.88));
}
function wrap(ctx, text, maxW){
  const out = []; let cur = "";
  for(const ch of text){ if(ctx.measureText(cur + ch).width > maxW && cur){ out.push(cur); cur = ch; } else cur += ch; }
  out.push(cur); return out;
}
function blobToImage(blob){
  return new Promise((res, rej) => { const u = URL.createObjectURL(blob); const i = new Image(); i.onload = () => { res(i); }; i.onerror = rej; i.src = u; });
}
/* 큰 사진은 긴 변 2000px로 줄여서 저장 */
async function shrink(blob, max=2000){
  const img = await blobToImage(blob);
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.9));
}

function renderMarkList(){
  const box = $("markList"); box.innerHTML = "";

edCanvas.addEventListener("pointerup", e => {
  if(!ed) return;
  const r = edCanvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  if(x<0||x>1||y<0||y>1) return;
  // 기존 표시를 눌렀는지 확인 (핀 머리 부분)
  const R = pinR(ed.img) / ed.img.width * r.width;   // 화면상 반지름
  for(let i = ed.rec.marks.length-1; i >= 0; i--){
    const m = ed.rec.marks[i];
    const px = m.x*r.width, py = m.y*r.height - R*1.9;
    const dx = (e.clientX - r.left) - px, dy = (e.clientY - r.top) - py;
    if(dx*dx + dy*dy < (R*1.4)**2){ openMarkSheet(i); return; }
  }
  ed.rec.marks.push({x, y, type: curType, memo: ""});
  drawEditor(); renderMarkList();
  openMarkSheet(ed.rec.marks.length-1, true);
});

   AR 모드 (안드로이드 크롬: WebXR 바닥·벽 인식)

let refreshArTypes = null;
refreshArTypes = buildTypeButtons($("arTypes"), () => curType, k => { curType = k; refreshEdTypes(); });

let arSupported = false;
(async () => {
  try{ arSupported = !!(navigator.xr && await navigator.xr.isSessionSupported("immersive-ar")); }catch{ arSupported = false; }
  $("btnAR").classList.toggle("hidden", !arSupported);
})();

let ar = null;
$("btnAR").onclick = startAR;

async function startAR(){
  const meta = formMeta();
  const overlay = $("arOverlay"); overlay.classList.remove("hidden");
  let session;
  try{
    session = await navigator.xr.requestSession("immersive-ar", {
      requiredFeatures: ["hit-test"],
      optionalFeatures: ["dom-overlay", "camera-access", "anchors", "local-floor"],
      domOverlay: {root: overlay},
    });
  }catch(err){
    overlay.classList.add("hidden");
    alert("AR을 시작하지 못했습니다. 카메라 권한을 허용했는지 확인해 주세요.\n(" + err.message + ")");
    return;
  }
  const canvas = document.createElement("canvas");
  const gl = canvas.getContext("webgl2", {xrCompatible: true, alpha: true}) || canvas.getContext("webgl", {xrCompatible: true, alpha: true});
  const renderer = new THREE.WebGLRenderer({canvas, context: gl, alpha: true, antialias: true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType("local");
  await renderer.xr.setSession(session);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2.2));

  // 조준 표시 (인식된 면 위의 고리)
  const reticle = new THREE.Mesh(new THREE.RingGeometry(0.06, 0.08, 32).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({color: 0xffffff}));
  reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);

  const viewerSpace = await session.requestReferenceSpace("viewer");
  const hitSource = await session.requestHitTestSource({space: viewerSpace});
  const refSpace = renderer.xr.getReferenceSpace();
  const glBinding = window.XRWebGLBinding ? new XRWebGLBinding(session, gl) : null;

  ar = {session, renderer, scene, camera, reticle, hitSource, refSpace, glBinding, gl, pins: [], meta, lastHit: null, wantShot: false, ended: false};

  // 화면을 누르면 표시 (버튼 위를 누른 경우는 제외)
  overlay.addEventListener("beforexrselect", e => { if(e.target !== overlay) e.preventDefault(); });
  session.addEventListener("select", () => placePin());
  session.addEventListener("end", () => finishAR());

  renderer.setAnimationLoop((t, frame) => onXRFrame(frame));
}

function makeLabel(n, color){
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const x = c.getContext("2d");
  x.beginPath(); x.arc(64, 64, 58, 0, Math.PI*2); x.fillStyle = color; x.fill();
  x.lineWidth = 8; x.strokeStyle = "#fff"; x.stroke();
  x.fillStyle = "#fff"; x.font = "700 68px sans-serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(String(n), 64, 68);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map: tex, depthTest: false}));
  s.scale.set(0.12, 0.12, 0.12); s.renderOrder = 10;
  return s;
}
function placePin(){
  if(!ar || !ar.lastHit){ toast("아직 면을 못 찾았습니다. 휴대폰을 조금 더 움직여 주세요."); return; }
  const t = typeOf(curType); const n = ar.pins.length + 1;
  const g = new THREE.Group();
  const col = new THREE.Color(t.color);
  const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.25, 8), new THREE.MeshStandardMaterial({color: col}));
  stick.position.y = 0.125;
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.06, 16).rotateX(Math.PI), new THREE.MeshStandardMaterial({color: col}));
  cone.position.y = 0.03;
  const disc = new THREE.Mesh(new THREE.RingGeometry(0.05, 0.07, 32).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({color: col, side: THREE.DoubleSide}));
  const label = makeLabel(n, t.color); label.position.y = 0.32;
  g.add(stick, cone, disc, label);
  // 위치는 인식된 면의 점, 막대는 항상 위쪽(세로)으로 세움
  const p = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
  ar.lastHit.decompose(p, q, sc);
  g.position.copy(p);
  ar.scene.add(g);
  ar.pins.push({group: g, type: curType, pos: p.clone(), labelPos: p.clone().add(new THREE.Vector3(0, 0.32, 0))});
  if(navigator.vibrate) navigator.vibrate(30);
  $("arMsg").textContent = `${n}개 표시함. 다 찍으면 '촬영·저장'을 누르세요.`;
}
$("arPlace").onclick = e => { e.stopPropagation(); placePin(); };
$("arUndo").onclick = e => { e.stopPropagation(); if(!ar || !ar.pins.length) return; const p = ar.pins.pop(); ar.scene.remove(p.group); $("arMsg").textContent = `${ar.pins.length}개 표시함.`; };
$("arShot").onclick = e => { e.stopPropagation(); if(!ar) return; if(!ar.pins.length && !confirm("표시 없이 촬영할까요?")) return; ar.wantShot = true; };
$("arExit").onclick = e => { e.stopPropagation(); if(ar) ar.session.end(); };

function onXRFrame(frame){
  if(!ar || !frame) return;
  const hits = frame.getHitTestResults(ar.hitSource);
  if(hits.length){
    const pose = hits[0].getPose(ar.refSpace);
    ar.reticle.visible = true; ar.reticle.matrix.fromArray(pose.transform.matrix);
    ar.lastHit = new THREE.Matrix4().fromArray(pose.transform.matrix);
    if(!ar.pins.length) $("arMsg").textContent = "흰 고리가 보이는 곳에 표시됩니다. 화면이나 '여기 표시'를 누르세요.";
  } else { ar.reticle.visible = false; ar.lastHit = null; }

  if(ar.wantShot){
    ar.wantShot = false;
    const vp = frame.getViewerPose(ar.refSpace);
    if(vp) captureFrame(vp.views[0]);
  }
  ar.renderer.render(ar.scene, ar.camera);
}

/* 카메라 영상 한 장 + 표시 위치(사진 좌표)를 뽑아 편집기로 넘김 */
function captureFrame(view){
  let photoCanvas = null;
  try{
    if(view.camera && ar.glBinding) photoCanvas = readCameraImage(view);
  }catch(err){ console.warn(err); }
  ar.renderer.resetState();
  // 표시 위치를 화면 비율 좌표(0~1)로 계산
  const P = new THREE.Matrix4().fromArray(view.projectionMatrix);
  const V = new THREE.Matrix4().fromArray(view.transform.inverse.matrix);
  const PV = P.multiply(V);
  const marks = [];
  for(const p of ar.pins){
    const v = new THREE.Vector4(p.pos.x, p.pos.y, p.pos.z, 1).applyMatrix4(PV);
    if(v.w <= 0) { marks.push(null); continue; }
    const x = (v.x/v.w + 1)/2, y = (1 - v.y/v.w)/2;
    marks.push({x, y, type: p.type, memo: "", inView: x>=0 && x<=1 && y>=0 && y<=1});
  }
  ar.shot = {photoCanvas, marks, w: view.camera?.width, h: view.camera?.height};
  ar.session.end();
}

function readCameraImage(view){
  const gl = ar.gl, cam = view.camera;
  const camTex = ar.glBinding.getCameraImage(cam);
  if(!camTex) return null;
  const w = cam.width, h = cam.height;
  const vs = `attribute vec2 p; varying vec2 uv; void main(){ uv = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;
  const fs = `precision mediump float; varying vec2 uv; uniform sampler2D t; void main(){ gl_FragColor = texture2D(t, uv); }`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const out = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, out);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, out, 0);
  gl.viewport(0, 0, w, h); gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND); gl.disable(gl.SCISSOR_TEST);
  gl.useProgram(prog);
  const loc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, camTex); gl.uniform1i(gl.getUniformLocation(prog, "t"), 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  const px = new Uint8Array(w*h*4); gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.deleteFramebuffer(fb); gl.deleteTexture(out); gl.deleteBuffer(buf); gl.deleteProgram(prog);
  // WebGL은 아래에서부터 읽으므로 위아래를 뒤집어 사진으로
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d"); const id = ctx.createImageData(w, h);
  const row = w*4;
  for(let y = 0; y < h; y++) id.data.set(px.subarray((h-1-y)*row, (h-y)*row), y*row);
  ctx.putImageData(id, 0, 0);
  return c;
}

async function finishAR(){
  if(!ar || ar.ended) return;
  ar.ended = true;
  const {shot, meta, renderer, hitSource} = ar;
  try{ hitSource.cancel(); }catch{}
  renderer.setAnimationLoop(null);
  $("arOverlay").classList.add("hidden");
  ar = null;
  if(!shot) return;
  const gps = await Promise.race([getGPS(), new Promise(r => setTimeout(() => r(null), 3000))]);
  const marks = shot.marks.filter(m => m && m.inView).map(({x,y,type,memo}) => ({x,y,type,memo}));
  const lost = shot.marks.filter(m => !m || !m.inView).length;
  let photo;
  if(shot.photoCanvas){
    photo = await new Promise(res => shot.photoCanvas.toBlob(res, "image/jpeg", 0.9));
  } else {
    // 카메라 사진을 못 받은 휴대폰: 회색 바탕에 표시 위치만 남기고, 사진은 편집기에서 바꿀 수 있게 안내
    const c = document.createElement("canvas"); c.width = 1080; c.height = Math.round(1080 * innerHeight / innerWidth);
    const x = c.getContext("2d"); x.fillStyle = "#555"; x.fillRect(0,0,c.width,c.height);
    x.fillStyle = "#fff"; x.font = "40px sans-serif"; x.textAlign = "center";
    x.fillText("이 휴대폰은 AR 카메라 사진 저장이 안 됩니다", c.width/2, c.height/2 - 30);
    x.fillText("표시 위치만 기록했습니다", c.width/2, c.height/2 + 30);
    photo = await new Promise(res => c.toBlob(res, "image/jpeg", 0.9));
    toast("카메라 사진을 받지 못해 표시 위치만 저장합니다. 휴대폰 화면 캡처도 함께 남겨 두세요.", 5000);
  }
  if(lost) toast(`화면 밖에 있던 표시 ${lost}개는 사진에서 빠졌습니다`, 3500);
  openEditor({id: crypto.randomUUID(), created: Date.now(), mode: "ar", ...meta, gps, photo, marks}, true);
}

/* ======================================================================
   카메라로 마킹 (아이폰·안드로이드 공통)
   - 카메라 영상 위를 누르면 번호 표시
   - 휴대폰 기울기 센서로 표시를 '방향'에 붙여 둠 (제자리에서 돌려 보는 정도까지 맞음)
   ====================================================================== */
const refreshCamTypes = buildTypeButtons($("camTypes"), () => curType, k => { curType = k; refreshEdTypes(); refreshArTypes(); });
let cam = null;
const LONG_FOV = 66 * Math.PI/180;   // 휴대폰 기본 후면 카메라 긴 변 화각(대략)

function rotMatrix(a, b, g){   // 기기 → 세상 (W3C deviceorientation: Z-X'-Y'')
  const d = Math.PI/180, ca=Math.cos(a*d), sa=Math.sin(a*d), cb=Math.cos(b*d), sb=Math.sin(b*d), cg=Math.cos(g*d), sg=Math.sin(g*d);
  return [
    ca*cg - sa*sb*sg, -cb*sa, ca*sg + cg*sa*sb,
    cg*sa + ca*sb*sg,  ca*cb, sa*sg - ca*cg*sb,
    -cb*sg,            sb,    cb*cg ];
}
const mulV = (M, v) => [M[0]*v[0]+M[1]*v[1]+M[2]*v[2], M[3]*v[0]+M[4]*v[1]+M[5]*v[2], M[6]*v[0]+M[7]*v[1]+M[8]*v[2]];
const mulTV = (M, v) => [M[0]*v[0]+M[3]*v[1]+M[6]*v[2], M[1]*v[0]+M[4]*v[1]+M[7]*v[2], M[2]*v[0]+M[5]*v[1]+M[8]*v[2]];
function screenAngle(){ return (screen.orientation && screen.orientation.angle) || window.orientation || 0; }

/* 화면 좌표 ↔ 영상 좌표 (object-fit: cover) */
function coverMap(){
  const v = $("camVideo"), W = innerWidth, H = innerHeight, vw = v.videoWidth || W, vh = v.videoHeight || H;
  const s = Math.max(W/vw, H/vh);
  return {s, ox: (W - vw*s)/2, oy: (H - vh*s)/2, vw, vh, f: (Math.max(vw, vh)/2) / Math.tan(LONG_FOV/2)};
}
/* 영상 좌표 → 카메라 방향 (화면 기준: x 오른쪽, y 위, -z 앞) → 세상 방향 */
function videoToDir(px, py, m){
  const d = [(px - m.vw/2)/m.f, -(py - m.vh/2)/m.f, -1];
  const ang = -screenAngle() * Math.PI/180, c = Math.cos(ang), sn = Math.sin(ang);
  const dd = [d[0]*c - d[1]*sn, d[0]*sn + d[1]*c, d[2]];   // 화면 회전 보정 → 기기 좌표
  return cam.R ? mulV(cam.R, dd) : dd;
}
function dirToVideo(w, m){
  let d = cam.R ? mulTV(cam.R, w) : w;
  const ang = screenAngle() * Math.PI/180, c = Math.cos(ang), sn = Math.sin(ang);
  d = [d[0]*c - d[1]*sn, d[0]*sn + d[1]*c, d[2]];
  if(d[2] >= -0.05) return null;   // 뒤쪽
  return {x: m.vw/2 + m.f * d[0]/(-d[2]), y: m.vh/2 - m.f * d[1]/(-d[2])};
}

function onOrient(e){
  if(!cam || e.alpha == null) return;
  cam.R = rotMatrix(e.alpha, e.beta, e.gamma);
  cam.gotGyro = true;
}

async function startCam(){
  const meta = formMeta();
  // 아이폰은 기울기 센서 권한을 버튼 누를 때 물어야 함
  let gyroOK = true;
  if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function"){
    try{ gyroOK = (await DeviceOrientationEvent.requestPermission()) !== "denied"; }catch{ gyroOK = true; }
  }
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: "environment"}, width: {ideal: 1920}, height: {ideal: 1920}}, audio: false});
  }catch(err){
    alert("카메라를 열지 못했습니다. 브라우저 설정에서 카메라 권한을 허용해 주세요.\n(" + err.message + ")"); return;
  }
  cam = {stream, meta, pins: [], R: null, gyro: gyroOK, gotGyro: false, raf: 0};
  const v = $("camVideo"); v.srcObject = stream; try{ await v.play(); }catch{}
  $("cam").classList.remove("hidden"); refreshCamTypes();
  $("camGyro").textContent = gyroOK ? "방향고정 켬" : "방향고정 끔";
  if(gyroOK) window.addEventListener("deviceorientation", onOrient);
  $("camMsg").textContent = "하자 위치를 화면에서 누르세요. 휴대폰을 돌려도 표시가 그 자리에 붙어 있습니다.";
  const loop = () => { if(!cam) return; renderCamPins(); cam.raf = requestAnimationFrame(loop); };
  loop();
}
function renderCamPins(){
  const box = $("camPins"), m = coverMap();
  while(box.children.length < cam.pins.length){
    const d = document.createElement("div"); d.className = "cpin"; d.innerHTML = "<b></b><i></i>"; box.appendChild(d);
  }
  while(box.children.length > cam.pins.length) box.lastChild.remove();
  cam.pins.forEach((p, i) => {
    const el = box.children[i], col = typeOf(p.type).color;
    const vp = cam.gyro && cam.gotGyro ? dirToVideo(p.dir, m) : p.v;
    if(!vp){ el.style.display = "none"; return; }
    el.style.display = ""; el.style.left = (m.ox + vp.x*m.s) + "px"; el.style.top = (m.oy + vp.y*m.s) + "px";
    el.querySelector("i").textContent = i+1; el.querySelector("i").style.background = col; el.querySelector("b").style.borderTopColor = col;
  });
}
$("cam").addEventListener("click", e => {
  if(!cam || e.target.closest("#camTop,#camBottom")) return;
  const m = coverMap();
  const vx = (e.clientX - m.ox)/m.s, vy = (e.clientY - m.oy)/m.s;
  cam.pins.push({type: curType, v: {x: vx, y: vy}, dir: videoToDir(vx, vy, m)});
  if(navigator.vibrate) navigator.vibrate(25);
  $("camMsg").textContent = `${cam.pins.length}개 표시함. 다 찍으면 '촬영·저장'을 누르세요.`;
});
$("camUndo").onclick = () => { if(cam && cam.pins.length){ cam.pins.pop(); $("camMsg").textContent = `${cam.pins.length}개 표시함.`; } };
$("camGyro").onclick = () => {
  if(!cam) return;
  if(!cam.gyro){
    // 현재 화면 위치를 기준으로 다시 방향을 잡음
    cam.gyro = true; window.addEventListener("deviceorientation", onOrient);
    const m = coverMap(); cam.pins.forEach(p => p.dir = videoToDir(p.v.x, p.v.y, m));
  } else {
    const m = coverMap(); cam.pins.forEach(p => { const q = cam.gotGyro ? dirToVideo(p.dir, m) : p.v; if(q) p.v = q; });
    cam.gyro = false; window.removeEventListener("deviceorientation", onOrient);
  }
  $("camGyro").textContent = cam.gyro ? "방향고정 켬" : "방향고정 끔";
  toast(cam.gyro ? "휴대폰을 돌려도 표시가 그 방향에 붙어 있습니다" : "표시가 화면에 고정됩니다");
};
function stopCam(){
  if(!cam) return;
  cancelAnimationFrame(cam.raf); window.removeEventListener("deviceorientation", onOrient);
  cam.stream.getTracks().forEach(t => t.stop());
  $("camVideo").srcObject = null; $("camPins").innerHTML = ""; $("cam").classList.add("hidden");
  cam = null;
}
$("camExit").onclick = () => { if(cam.pins.length && !confirm("촬영하지 않고 닫을까요? 표시가 사라집니다.")) return; stopCam(); };
$("camShot").onclick = async () => {
  if(!cam) return;
  const v = $("camVideo"), m = coverMap();
  if(!v.videoWidth){ toast("카메라가 아직 준비되지 않았습니다"); return; }
  // 지금 화면에 보이는 부분만 잘라서 사진으로 (화면에서 본 그대로)
  const sx = Math.max(0, -m.ox/m.s), sy = Math.max(0, -m.oy/m.s);
  const sw = Math.min(m.vw, innerWidth/m.s), sh = Math.min(m.vh, innerHeight/m.s);
  const c = document.createElement("canvas"); c.width = Math.round(sw); c.height = Math.round(sh);
  c.getContext("2d").drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
  const marks = [];
  let lost = 0;
  for(const p of cam.pins){
    const q = cam.gyro && cam.gotGyro ? dirToVideo(p.dir, m) : p.v;
    const x = q ? (q.x - sx)/sw : -1, y = q ? (q.y - sy)/sh : -1;
    if(x < 0 || x > 1 || y < 0 || y > 1){ lost++; continue; }
    marks.push({x, y, type: p.type, memo: ""});
  }
  const meta = cam.meta;
  stopCam();
  const photo = await shrink(await new Promise(r => c.toBlob(r, "image/jpeg", 0.92)));
  if(lost) toast(`화면 밖에 있던 표시 ${lost}개는 사진에서 빠졌습니다`, 3500);
  const gps = await Promise.race([getGPS(), new Promise(r => setTimeout(() => r(null), 3000))]);
  openEditor({id: crypto.randomUUID(), created: Date.now(), mode: "cam", ...meta, gps, photo, marks}, true);
};
$("btnCam").onclick = () => {
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast("이 브라우저는 카메라 화면을 지원하지 않습니다. '사진으로 마킹'을 쓰세요.", 4000); return; }
  startCam();
};

/* ---------- 시작 ---------- */
loadForm();
renderList();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
