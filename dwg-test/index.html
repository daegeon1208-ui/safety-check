<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DWG 도면 견본</title>
<style>
:root{--bg:#F3F4F6;--card:#fff;--ink:#111827;--sub:#6B7280;--line:#E5E7EB;--accent:#1F2937;--pin:#D3162F;--paper:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111318;--card:#1C1F26;--ink:#F3F4F6;--sub:#9CA3AF;--line:#2D323C;--accent:#E5E7EB}}
:root[data-theme="dark"]{--bg:#111318;--card:#1C1F26;--ink:#F3F4F6;--sub:#9CA3AF;--line:#2D323C;--accent:#E5E7EB}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:#1F2937;color:#fff}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{font-size:12px;opacity:.7;font-weight:500}
.hb{border:0;border-radius:16px;padding:7px 12px;font-size:13px;font-weight:600;background:rgba(255,255,255,.14);color:#fff}
#start{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center;gap:14px}
#start p{margin:0;color:var(--sub);font-size:14.5px;line-height:1.6;max-width:420px}
.big{display:inline-block;border:0;border-radius:14px;padding:15px 22px;font-size:16px;font-weight:700;background:var(--accent);color:var(--bg)}
#msg{font-size:14px;color:var(--sub);min-height:20px}
#msg.err{color:#D3162F}
#view{flex:1;position:relative;overflow:hidden;touch-action:none;background:var(--paper)}
#view.dark{background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%}
#pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;width:30px;height:38px;margin:-38px 0 0 -15px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.pin b{position:absolute;left:0;right:0;top:6px;text-align:center;color:#fff;font:700 13px/1 -apple-system,sans-serif}
#info{position:absolute;left:10px;top:10px;background:rgba(17,24,39,.78);color:#fff;font-size:12px;line-height:1.5;padding:7px 10px;border-radius:10px;max-width:calc(100% - 20px)}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:10px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));pointer-events:none}
#bar button{pointer-events:auto;border:0;border-radius:22px;padding:12px 16px;font-size:14.5px;font-weight:700;background:#fff;color:#111827;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#bar button.on{background:#D3162F;color:#fff}
#hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(17,24,39,.85);color:#fff;font-size:13.5px;padding:8px 14px;border-radius:18px;white-space:nowrap}
</style>
</head>
<body>
<header><h1 id="ttl">DWG 도면 견본 <small>테스트</small></h1><button class="hb" id="openBtn" hidden>다른 DWG</button></header>
<div id="start">
  <p>DWG 파일을 고르면 휴대폰에서 바로 도면을 그려 줍니다.<br>두 손가락으로 확대·이동하고, <b>핀 찍기</b>로 위치를 눌러 핀을 놓아 보세요.</p>
  <button class="big" id="pick">DWG 파일 고르기</button>
  <div id="msg"></div>
  <p style="font-size:12.5px">처음 한 번은 도면 읽는 프로그램(약 6MB)을 받느라 조금 걸립니다. 파일은 이 휴대폰 안에서만 읽고 어디에도 올리지 않습니다.</p>
</div>
<div id="view" hidden>
  <canvas id="cv"></canvas><div id="pins"></div>
  <div id="info"></div><div id="hint" hidden>핀 놓을 위치를 누르세요</div>
  <div id="bar"><button id="fitBtn">전체</button><button id="pinBtn">핀 찍기</button><button id="bgBtn">검은 배경</button></div>
</div>
<input type="file" id="file" hidden>
<script type="module">
import { build as rawBuild, readDwg, loadLib } from "../pins/dwg2pdf.js";
const $ = s => document.querySelector(s);
let lib = null, D = null;   // D: 그리기 목록
const V = { k: 1, tx: 0, ty: 0, dark: false, pinMode: false, pins: [] };

/* ---------- DWG → 그리기 목록 (도면 핀 앱과 같은 변환기) ---------- */
function build(db) {
  const R = rawBuild(db); if (!R) return null;
  const ox = R.x0, oy = R.y0, mk = (arr, close) => { const P = new Path2D(); for (const p of arr) { P.moveTo(p[0][0] - ox, p[0][1] - oy); for (let i = 1; i < p.length; i++) P.lineTo(p[i][0] - ox, p[i][1] - oy); if (close) P.closePath(); } return P; };
  return {
    strokes: [...R.strokes].map(([k, arr]) => ({ c: k.split(",").map(Number), p: mk(arr) })),
    fills: [...R.fills].map(([k, arr]) => ({ c: k.split(",").map(Number), p: mk(arr, true) })),
    texts: R.texts.map(t => Object.assign({}, t, { x: t.x - ox, y: t.y - oy })),
    w: R.w, h: R.h, nEnt: R.nEnt, nSeg: R.nSeg
  };
}

/* ---------- 그리기 ---------- */
const cv = $("#cv"), ctx = cv.getContext("2d"), view = $("#view");
const dpr = () => Math.min(3, window.devicePixelRatio || 1);
function shade(c) {   // 흰 바탕에서 안 보이는 밝은 색은 어둡게
  if (V.dark) return `rgb(${c})`;
  const L = (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255;
  if (L > 0.92) return "rgb(20,20,20)";
  if (L > 0.55) { const f = 0.55 / L; return `rgb(${c.map(v => Math.round(v * f))})`; }
  return `rgb(${c})`;
}
let raf = 0;
const draw = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); };
function render() {
  if (!D) return;
  const W = view.clientWidth, H = view.clientHeight, r = dpr();
  if (cv.width !== Math.round(W * r) || cv.height !== Math.round(H * r)) { cv.width = Math.round(W * r); cv.height = Math.round(H * r); }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  // 도면 좌표(위가 +y) → 화면: sx = tx + x*k, sy = ty - y*k
  ctx.setTransform(V.k * r, 0, 0, -V.k * r, V.tx * r, V.ty * r);
  for (const f of D.fills) { ctx.fillStyle = shade(f.c); ctx.fill(f.p, "evenodd"); }
  ctx.lineWidth = 1 / V.k; ctx.lineJoin = "round";
  for (const s of D.strokes) { ctx.strokeStyle = shade(s.c); ctx.stroke(s.p); }
  ctx.setTransform(r, 0, 0, r, 0, 0);
  ctx.textBaseline = "alphabetic";
  for (const t of D.texts) {
    const sh = t.h * V.k; if (sh < 2.5) continue;
    const sx = V.tx + t.x * V.k, sy = V.ty - t.y * V.k;
    if (sx < -2000 || sx > W + 2000 || sy < -2000 || sy > H + 2000) continue;
    const fs = sh / 0.72;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(-t.r); ctx.scale(t.wf || 1, 1);
    ctx.font = `${fs}px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif`;
    const tw = ctx.measureText(t.s).width;
    ctx.fillStyle = shade(t.c); ctx.fillText(t.s, -tw * t.ha, sh * t.va); ctx.restore();
  }
  drawPins();
}
function fit() {
  const W = view.clientWidth, H = view.clientHeight - 70;
  V.k = Math.min(W / D.w, H / D.h) * 0.94;
  V.tx = (W - D.w * V.k) / 2; V.ty = (H + D.h * V.k) / 2 + 4;
  draw();
}
function drawPins() {
  $("#pins").innerHTML = V.pins.map((p, i) => `<div class="pin" style="left:${V.tx + p.x * V.k}px;top:${V.ty - p.y * V.k}px"><svg width="30" height="38" viewBox="0 0 30 38"><path d="M15 37C15 37 2 22 2 14a13 13 0 0 1 26 0c0 8-13 23-13 23z" fill="#D3162F" stroke="#fff" stroke-width="2"/></svg><b>${i + 1}</b></div>`).join("");
}

/* ---------- 손가락 조작 ---------- */
const ptrs = new Map(); let G = null;
const rel = e => { const b = view.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
view.addEventListener("pointerdown", e => {
  if (e.target.closest("#bar")) return;
  view.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, rel(e));
  if (ptrs.size === 1) { const p = rel(e); G = { type: "pan", sx: p.x, sy: p.y, tx: V.tx, ty: V.ty, moved: false, t: Date.now() }; }
  else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; G = { type: "pinch", d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, k: V.k, tx: V.tx, ty: V.ty }; }
});
view.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId) || !G) return; ptrs.set(e.pointerId, rel(e));
  if (G.type === "pan" && ptrs.size === 1) { const p = rel(e), dx = p.x - G.sx, dy = p.y - G.sy; if (Math.hypot(dx, dy) > 8) G.moved = true; if (G.moved) { V.tx = G.tx + dx; V.ty = G.ty + dy; draw(); } }
  else if (G.type === "pinch" && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y) || 1, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const fitK = Math.min(view.clientWidth / D.w, view.clientHeight / D.h), nk = Math.max(fitK * 0.5, Math.min(fitK * 400, G.k * d / G.d));
    const wx = (G.mx - G.tx) / G.k, wy = (G.ty - G.my) / G.k; V.k = nk; V.tx = mx - wx * nk; V.ty = my + wy * nk; draw();
  }
});
const end = e => {
  if (!ptrs.has(e.pointerId)) return; const p = rel(e); ptrs.delete(e.pointerId);
  if (G && G.type === "pan" && !G.moved && Date.now() - G.t < 600 && V.pinMode) {
    V.pins.push({ x: (p.x - V.tx) / V.k, y: (V.ty - p.y) / V.k }); V.pinMode = false; $("#pinBtn").classList.remove("on"); $("#hint").hidden = true; drawPins();
  }
  if (ptrs.size === 1) { const q = [...ptrs.values()][0]; G = { type: "pan", sx: q.x, sy: q.y, tx: V.tx, ty: V.ty, moved: true, t: 0 }; }
  else if (!ptrs.size) G = null;
};
view.addEventListener("pointerup", end); view.addEventListener("pointercancel", end);
view.addEventListener("wheel", e => { e.preventDefault(); const p = rel(e), f = Math.exp(-e.deltaY * 0.0015), wx = (p.x - V.tx) / V.k, wy = (V.ty - p.y) / V.k; V.k *= f; V.tx = p.x - wx * V.k; V.ty = p.y + wy * V.k; draw(); }, { passive: false });
document.addEventListener("gesturestart", e => e.preventDefault());
window.addEventListener("resize", () => D && draw());

$("#fitBtn").onclick = () => fit();
$("#pinBtn").onclick = () => { V.pinMode = !V.pinMode; $("#pinBtn").classList.toggle("on", V.pinMode); $("#hint").hidden = !V.pinMode; };
$("#bgBtn").onclick = () => { V.dark = !V.dark; view.classList.toggle("dark", V.dark); $("#bgBtn").textContent = V.dark ? "흰 배경" : "검은 배경"; draw(); };

/* ---------- 파일 열기 ---------- */
const msg = (t, err) => { $("#msg").textContent = t; $("#msg").className = err ? "err" : ""; };
$("#pick").onclick = () => $("#file").click();
$("#openBtn").onclick = () => $("#file").click();
$("#file").onchange = async () => {
  const f = $("#file").files[0]; $("#file").value = ""; if (!f) return;
  $("#view").hidden = true; $("#start").hidden = false;
  try {
    if (!lib) { msg("도면 읽는 프로그램 받는 중… (처음 한 번)"); lib = await loadLib(); }
    msg(`${f.name} 읽는 중…`);
    const t0 = performance.now(), buf = await f.arrayBuffer();
    await new Promise(r => setTimeout(r, 30));
    const db = await readDwg(buf);
    const t1 = performance.now();
    D = build(db);
    if (!D) throw new Error("모형 공간에 그릴 내용이 없습니다");
    const t2 = performance.now();
    $("#start").hidden = true; $("#view").hidden = false; $("#openBtn").hidden = false;
    $("#ttl").innerHTML = `${f.name.replace(/[<>&]/g, "")} <small>DWG 견본</small>`;
    V.pins = []; fit();
    $("#info").textContent = `개체 ${D.nEnt.toLocaleString()}개 · 선 ${D.nSeg.toLocaleString()}토막 · 글자 ${D.texts.length.toLocaleString()}개 · 읽기 ${((t1 - t0) / 1000).toFixed(1)}초 + 그리기 준비 ${((t2 - t1) / 1000).toFixed(1)}초`;
    setTimeout(() => { $("#info").hidden = true; }, 6000); $("#info").hidden = false;
    msg("");
  } catch (err) { console.error(err); msg(err.message || String(err), true); }
};
window.V = V; window.__draw = draw;
</script>
</body>
</html>
