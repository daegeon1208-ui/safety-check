<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>핀톡 주소가 바뀌었어요</title>
<script>
// 핀톡은 새 주소로 옮겼습니다. 같은 사이트(github.io) 안이라 휴대폰에 저장된 도면·핀은 그대로 이어집니다.
(function(){
  var to="/pintalk/"+location.pathname.replace(/^.*\/pins\/?/,"")+location.search+location.hash;
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){
    navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ if(/\/safety-check\/pins\//.test(r.scope)) r.unregister(); }); }).catch(function(){});
  }
  setTimeout(function(){ location.replace(to); },300);
})();
</script>
<style>body{font-family:system-ui,sans-serif;background:#EDEDEB;color:#2B2B29;display:grid;place-items:center;min-height:100vh;margin:0;padding:0 16px;text-align:center}a{color:#E31937;font-weight:700}</style>
</head><body><div><h1 style="font-size:20px">핀톡 주소가 바뀌었어요</h1><p>새 주소로 이동하는 중입니다.<br><a href="/pintalk/">daegeon1208-ui.github.io/pintalk</a></p><p style="font-size:14px;color:#6b6b66">홈 화면 아이콘은 새 주소에서 다시 추가해 주세요.</p></div></body></html>
